spring.application.name=tipprunde-rest
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
management.endpoints.web.exposure.include=health
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.jwt.secret=${JWT_SECRET}
app.token.validity-hours=24
app.auth.manager=${AUTH_MANAGER:postgres}
app.match.manager=${MATCH_MANAGER:postgres}

app.startup.db-check=${DB_STARTUP_CHECK:true}

# Log-Level der Anwendung, auf Heroku als Config Var LOG_LEVEL änderbar (z. B. DEBUG), Standard INFO
logging.level.com.mosbach.tipprunde=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%logger{20}] %msg%n
