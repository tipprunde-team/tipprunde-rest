plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mosbach'
version = '0.0.1-SNAPSHOT'

// Kompilieren für Java 17, läuft auf JDK 17 bis 25
tasks.withType(JavaCompile).configureEach {
	options.release = 17
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'com.auth0:java-jwt:4.5.0'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Nach jedem Testlauf entsteht automatisch der Abdeckungsbericht (JaCoCo)
	finalizedBy tasks.named('jacocoTestReport')
}

// Testabdeckung: build/reports/jacoco/test/html/index.html (Qualitätsmetrik)
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		html.required = true
		xml.required = true
		csv.required = false
	}
}

// Heroku: build only the executable jar with a stable name (see Procfile)
tasks.named('jar') {
	enabled = false
}

tasks.named('bootJar') {
	archiveFileName = 'tipprunde-rest.jar'
}
